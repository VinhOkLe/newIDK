<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Component</title>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f1f3f7;
            --card-bg: #ffffff;
            --card-border-top: #e86338;
            --badge-color: #e86338;
            --title-color: #121926;
            --subtitle-color: #364152;
            --btn-bg: #e86338;
            --btn-bg-hover: #d2532a;
            --btn-text: #ffffff;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        /* Dark Theme Color Palette */
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border-top: #f97316;
            --badge-color: #fb923c;
            --title-color: #f8fafc;
            --subtitle-color: #cbd5e1;
            --btn-bg: #f97316;
            --btn-bg-hover: #ea580c;
            --btn-text: #ffffff;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 380px;
            position: relative;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 32px 28px 28px 28px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        /* Orange curved bar at top */
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background-color: var(--card-border-top);
        }

        .badge {
            color: var(--badge-color);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 16px;
            display: block;
        }

        .title {
            color: var(--title-color);
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .subtitle {
            color: var(--subtitle-color);
            font-size: 0.98rem;
            line-height: 1.5;
            margin-bottom: 24px;
            font-weight: 400;
        }

        .btn-theme {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 9999px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            outline: none;
            user-select: none;
            box-shadow: 0 4px 10px rgba(232, 99, 56, 0.25);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-theme:hover {
            background-color: var(--btn-bg-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(232, 99, 56, 0.35);
        }

        .btn-theme:active {
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(232, 99, 56, 0.2);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="card" id="profileCard">
            <span class="badge">FRONTEND STUDENT</span>
            <h1 class="title">Linh Nguyễn</h1>
            <p class="subtitle">Biến ý tưởng thành giao diện dễ dùng.</p>
            <button class="btn-theme" id="themeToggleBtn" onclick="toggleTheme()">
                Đổi theme
            </button>
        </div>
    </div>

    <script>
        /**
         * Toggles between Light and Dark mode on the root document
         */
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
        }
    </script>
</body>
</html>
